name: CI

on: [push]

env:
    PROPTEST_CASES: 32
    RUST_BACKTRACE: 1

jobs:
    check_rust_crates:
        name: check rust crates on ${{ matrix.name }}
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                name: [android, linux, windows]
                include:
                    - name: android
                      os: ubuntu-24.04
                      cargo-command: cross
                      target: aarch64-linux-android

                    - name: linux
                      os: ubuntu-24.04
                      cargo-command: cargo
                      test: true

                    - name: windows
                      os: windows-latest
                      cargo-command: cargo
                      test: true
                      # On windows, the vfs tests (and any tests involving mounting) fail with weird "null
                      # pointer dereference" error. Disabling them for now. Also the `safe_move` test fails
                      # with "file is being used by another process" error for some reason so disabling it as
                      # well. This needs to be looked into at some point.
                      unit-test-args: >
                          --exclude ouisync-vfs
                          --
                          --skip state::tests::move_repository
                          --skip state::tests::attempt_to_move_repository_over_existing_file
                          --skip safe_move::tests::attempt_to_move_to_subdir_of_src

        steps:
            - uses: actions/checkout@v6

            - name: Show rustc version
              run: rustc --version

            - name: Add rust target
              if: matrix.target != ''
              run: rustup target add ${{ matrix.target }}

            - uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
                  restore-keys: ${{ runner.os }}-cargo-

            - name: Install system dependencies (linux)
              if: matrix.name == 'linux'
              run: sudo apt-get install libfuse-dev

            - name: Install system dependencies (windows)
              if: matrix.name == 'windows'
              run: choco install dokany2

            - name: Install cross
              if: matrix.cargo-command == 'cross'
              run: cargo install cross --force --git https://github.com/cross-rs/cross

            - name: Run clippy
              run: >
                  ${{ matrix.cargo-command }} clippy
                  --package ouisync
                  --package ouisync-cli
                  --package ouisync-net
                  --package ouisync-service
                  --package ouisync-vfs
                  --package fs_util
                  --package logtee
                  ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
                  --all-targets
                  --no-deps
                  -- -Dwarnings

            - name: Run unit tests
              if: matrix.test
              run: ${{ matrix.cargo-command }} test --workspace --lib ${{ matrix.unit-test-args }}

            - name: Run lib integration tests
              if: matrix.test
              run: ${{ matrix.cargo-command }} test --package ouisync --test gc --test network --test sync
              env:
                  RUST_LOG: ouisync=debug,gc=debug,network=debug,sync=debug

            - name: Run cli integration tests
              if: matrix.test && matrix.name == 'linux'
              run: ${{ matrix.cargo-command }} test --package ouisync-cli --test cli

    check_kotlin_bindings:
        name: check kotlin bindings
        runs-on: ubuntu-24.04
        steps:
            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - uses: actions/checkout@v7

            - name: Free disk space
              uses: jlumbroso/free-disk-space@v1.3.1
              with:
                  android: false
                  tool-cache: true

            - name: Add rust targets
              run: rustup target add x86_64-linux-android armv7-linux-androideabi aarch64-linux-android

            - name: Setup java
              uses: actions/setup-java@v6
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: Setup gradle
              uses: gradle/gradle-build-action@v2.4.2

            - name: Install system dependencies
              # NOTE: fuse isn't used by the bindings themselves but it's required for the unit tests
              # because they use the linux version of the ouisync_service library, not the android one
              # and the linux version does currently unconditionally depend on fuse.
              run: sudo apt-get install libfuse-dev

            - name: Cache cargo artifacts
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Cache gradle artifacts
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: ${{ runner.os }}-gradle-${{ hashFiles('bindings/kotlin/**/*.gradle*', 'bindings/kotlin/**/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-gradle-

            # Needed by the gradle task which builds the rust library
            - name: Install cargo-ndk
              run: cargo install --force cargo-ndk

            - name: Run lint
              working-directory: bindings/kotlin
              run: ./gradlew --stacktrace lint

            - name: Run unit tests
              working-directory: bindings/kotlin
              run: ./gradlew --stacktrace testDebugUnitTest

            - name: Run instrumented tests
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  arch: x86_64
                  api-level: 35
                  target: google_apis
                  working-directory: bindings/kotlin
                  script: ./gradlew ouisync-android:connectedDebugAndroidTest -Ptarget-platform=android-x64

            - name: Upload test results
              uses: actions/upload-artifact@v4
              with:
                  name: test-results
                  path: |
                      bindings/kotlin/build/ouisync-android/outputs/androidTest-results
                      bindings/kotlin/build/ouisync-android/reports
                      bindings/kotlin/build/ouisync-android/test-results
              if: always()

            - name: Build the example app
              working-directory: bindings/kotlin
              run: ./gradlew --stacktrace example:assembleDebug

    check_dart_bindings:
        name: check dart bindings on ${{ matrix.name }}
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                name: [linux, windows]
                include:
                    - name: linux
                      os: ubuntu-24.04
                      env:
                          OUISYNC_LIB: ../../target/debug/libouisync_service.so

                    - name: windows
                      os: windows-latest
                      env:
                          OUISYNC_LIB: ..\..\target\debug\ouisync_service.dll
                          DOKAN_DLL_OUTPUT_PATH: C:\Windows\System32

        env: ${{ matrix.env }}

        steps:
            - uses: actions/checkout@v7

            - uses: subosito/flutter-action@v2
              with:
                  channel: "stable"
                  cache: true

            # Cache rust artifacts
            - uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

            - name: Install system dependencies (linux)
              if: matrix.name == 'linux'
              run: sudo apt-get install libfuse-dev

            - name: Install system dependencies (windows)
              if: matrix.name == 'windows'
              run: choco install dokany2

            - name: Get dart dependencies
              working-directory: bindings/dart
              run: flutter pub get

            - name: Generate bindings
              working-directory: bindings/dart
              run: dart run tool/bindgen.dart

            - name: Analyze
              # analyze should be the same on all platforms so run it on just one to save time
              if: matrix.name == 'linux'
              working-directory: bindings/dart
              run: |
                  dart analyze lib
                  dart analyze test
                  dart analyze example

            - name: Build the ouisync service library for tests
              run: cargo build -p ouisync-service --lib

            - name: Run tests
              working-directory: bindings/dart
              env:
                  RUST_LOG: ouisync=debug,sqlx=warn
              run: flutter test

    build_session_python_bindings:
        name: build session python bindings package
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - name: Setup python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Install build dependencies
              run: pip install build

            - name: Generate bindings
              run: python bindings/python/session/tool/bindgen.py

            - name: Build package
              working-directory: bindings/python/session
              run: python -m build

            - name: Upload wheel
              uses: actions/upload-artifact@v7
              with:
                  path: bindings/python/session/dist/*.whl
                  archive: false

            - name: Upload sdist
              uses: actions/upload-artifact@v7
              with:
                  path: bindings/python/session/dist/*.tar.gz
                  archive: false

    build_service_python_bindings:
        name: build service python bindings package (${{ matrix.name }})
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                name: [linux-x86_64, linux-aarch64, windows-x86_64, macos-aarch64]
                include:
                    # One matrix leg per target triple -- the resulting wheel is tagged
                    # accordingly in bindings/python/service/hatch_build.py. Only
                    # linux-aarch64 needs cross-compilation (via `cross`); the other
                    # targets are native to their runner.
                    - name: linux-x86_64
                      os: ubuntu-24.04
                      target: x86_64-unknown-linux-gnu
                      cargo-command: cargo

                    - name: linux-aarch64
                      os: ubuntu-24.04
                      target: aarch64-unknown-linux-gnu
                      cargo-command: cross

                    - name: windows-x86_64
                      os: windows-latest
                      target: x86_64-pc-windows-msvc
                      cargo-command: cargo

                    - name: macos-aarch64
                      os: macos-latest
                      target: aarch64-apple-darwin
                      cargo-command: cargo

        steps:
            - uses: actions/checkout@v7

            - uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Setup python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Install build dependencies
              run: pip install build

            - name: Install cross
              if: matrix.cargo-command == 'cross'
              run: cargo install cross --force --git https://github.com/cross-rs/cross

            - name: Build package
              working-directory: bindings/python/service
              # --wheel only: the build hook needs the workspace's Rust sources to build
              # the bundled native library, which aren't available when building from an
              # extracted sdist.
              run: python -m build --wheel
              env:
                  OUISYNC_TARGET: ${{ matrix.target }}
                  OUISYNC_CARGO: ${{ matrix.cargo-command }}

            - name: Upload wheel
              uses: actions/upload-artifact@v7
              with:
                  path: bindings/python/service/dist/*.whl
                  archive: false

    test_python_bindings:
        name: test python bindings
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7

            - uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Setup python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Generate bindings
              run: python bindings/python/session/tool/bindgen.py

            - name: Install packages
              run: pip install -e "bindings/python/session[test]" -e "bindings/python/service[test]"

            - name: Run session package tests
              working-directory: bindings/python/session
              run: pytest

            - name: Run service package tests
              working-directory: bindings/python/service
              run: pytest
