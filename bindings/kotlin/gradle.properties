android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m

org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

# The version of the Kotlin bindings consist of the version of the rust library followed by dash and
# followed by "revision" (e.g.: "1.2.3-4"). The revision is used to distinguish different versions
# of the bindings which use the same version of the rust library. When the bindings change but not
# the rust library, increment the revision. When the rust library changes (and so its version
# changes as well), reset the revision back to zero.
revision=0

# Options for building the native libraries (see README.md for details). Uncomment to set them here
# or pass them on the command line using `-P<name>=<value>`.
#
# Comma separated list of rust target triples to build for (android targets are used by
# ouisync-service-android, the others by ouisync-service-jvm). Default: all android targets and the
# host target.
#ouisync.targets=aarch64-linux-android,x86_64-unknown-linux-gnu
#
# Tool to build the non-host ouisync-service-jvm targets with (cross or cargo). Default: cross.
#ouisync.cargo=cross
#
# Cargo profile for ouisync-service-jvm (release or debug). Default: release.
#ouisync.profile=debug
#
# Directory with prebuilt native libraries for ouisync-service-jvm (with the layout
# `<target triple>/<library>`, e.g. `x86_64-unknown-linux-gnu/libouisync_service.so`).
#ouisync.nativeLibsDir=/path/to/native-libs
