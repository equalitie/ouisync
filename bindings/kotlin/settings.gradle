pluginManagement {
    includeBuild('ouisync-convention')
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        google()
    }
}

rootProject.name = 'ouisync'

include 'ouisync-android'
include 'ouisync-service-android'
include 'ouisync-service-common'
include 'ouisync-service-jvm'
include 'ouisync-session'
include 'example:shared'
include 'example:android'
include 'example:desktop'
