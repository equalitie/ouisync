import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'org.jetbrains.kotlin.multiplatform'
    id 'com.android.kotlin.multiplatform.library'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.21'
    id 'dokka-convention'
}

version = rootProject.version
group   = rootProject.group

// Generate the API source files
def generateApi = tasks.register('generateApi', Exec) {
    outputs.dir(layout.buildDirectory.dir('gen'))

    description = 'Generate the API classes'
    group = 'Build'
    workingDir "$rootDir/../.."
    commandLine 'cargo', 'run', '--package', 'ouisync-bindgen', '--', 'kotlin'

    doFirst {
        def dir = layout.buildDirectory.dir('gen').get().asFile
        mkdir(dir)
        standardOutput = new FileOutputStream("$dir/Api.kt")
    }
}

kotlin {
    jvm {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }

    android {
        namespace = 'org.equalitie.ouisync.session'
        compileSdk = 37
        minSdk = 23

        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }

        withHostTest {
        }
    }

    sourceSets {
        commonMain {
            // Add directory with generated source files
            kotlin.srcDir(generateApi)

            dependencies {
                implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
                implementation 'org.jetbrains.kotlinx:kotlinx-datetime:0.6.2'
                implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.0'
                implementation 'org.msgpack:msgpack-core:0.9.5'
            }
        }

        commonTest {
            dependencies {
                implementation 'org.jetbrains.kotlin:kotlin-test'
                implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'

                // The tests run against a real service, including the native library for the host platform
                // (built by `ouisync-service-jvm`).
                implementation project(':ouisync-service-jvm')

            }
        }

        androidMain {
            // dependencies {
            // }
        }

        jvmTest {
            dependencies {
                implementation 'org.junit.jupiter:junit-jupiter:5.12.2'
                runtimeOnly    'org.junit.platform:junit-platform-launcher:1.12.2'
            }
        }

        // androidDeviceTest {
        //     dependencies {
        //         implementation 'androidx.test:runner:1.7.0'
        //         implementation 'androidx.test.ext:junit:1.3.0'
        //     }
        // }
    }
}

tasks.named('jvmTest') {
    useJUnitPlatform()

    testLogging {
        showStandardStreams = true
        exceptionFormat = "full"
    }
}

