import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'org.jetbrains.kotlin.multiplatform'
    id 'com.android.kotlin.multiplatform.library'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.21'
    id 'dokka-convention'
    id 'maven-publish'
    id 'signing'
}

version = rootProject.version
group   = rootProject.group

// Generate the API source files
def generateApi = tasks.register('generateApi', Exec) {
    outputs.dir(layout.buildDirectory.dir('gen'))

    description = 'Generate the API classes'
    group = 'Build'
    workingDir "$rootDir/../.."
    commandLine 'cargo', 'run', '--package', 'ouisync-bindgen', '--', 'kotlin'

    doFirst {
        def dir = layout.buildDirectory.dir('gen').get().asFile
        mkdir(dir)
        standardOutput = new FileOutputStream("$dir/Api.kt")
    }
}

// Javadoc jar (required by Maven Central) containing the dokka generated HTML docs. The javadoc
// format is not used because dokka supports it only for JVM projects, not multiplatform ones.
def javadocJar = tasks.register('javadocJar', Jar) {
    def dokkaTask = tasks.named('dokkaGeneratePublicationHtml')

    description = 'Assemble a javadoc jar containing the dokka generated HTML docs'
    group = 'documentation'
    from(dokkaTask.flatMap { it.outputDirectory })
    archiveClassifier = 'javadoc'
}

kotlin {
    jvm {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }

    android {
        namespace = 'org.equalitie.ouisync.session'
        compileSdk = 37
        minSdk = 23

        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }

        withHostTest {
        }
    }

    sourceSets {
        commonMain {
            // Add directory with generated source files
            kotlin.srcDir(generateApi)

            dependencies {
                implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
                implementation 'org.jetbrains.kotlinx:kotlinx-datetime:0.6.2'
                implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.0'
                implementation 'org.msgpack:msgpack-core:0.9.5'
            }
        }

        commonTest {
            dependencies {
                implementation 'org.jetbrains.kotlin:kotlin-test'
                implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'

                // The tests run against a real service, including the native library for the host platform
                // (built by `ouisync-service-jvm`).
                implementation project(':ouisync-service-jvm')

            }
        }

        jvmTest {
            dependencies {
                runtimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
            }
        }

        // androidDeviceTest {
        //     dependencies {
        //         implementation 'androidx.test:runner:1.7.0'
        //         implementation 'androidx.test.ext:junit:1.3.0'
        //     }
        // }
    }
}

tasks.named('jvmTest') {
    useJUnitPlatform()

    testLogging {
        showStandardStreams = true
        exceptionFormat = "full"
    }
}

// The Kotlin Multiplatform plugin creates the publications automatically (one for each target plus
// the root `kotlinMultiplatform` one which ties them together), so we only need to configure them.
publishing {
    publications.withType(MavenPublication).configureEach {
        // Maven Central requires a javadoc jar for every publication.
        artifact(javadocJar)

        pom {
            name = artifactId
            description = "Secure peer-to-peer file syncing library (session component)"
            url = 'https://github.com/equalitie/ouisync'
            licenses {
                license {
                    name = 'MPL-2.0'
                    url = 'https://github.com/equalitie/ouisync/blob/master/LICENSE'
                }
            }
            developers {
                developer {
                    name = 'Ouisync Developers'
                    email = 'ouisync@equalit.ie'
                }
            }

            scm {
                connection = 'scm:git:github.com/equalitie/ouisync.git'
                developerConnection = 'scm:git:ssh://github.com/equalitie/ouisync.git'
                url = 'https://github.com/equalitie/ouisync/tree/master/bindings/kotlin'
            }
        }
    }
}

signing {
    if (project.signingKey) {
        useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
    }

    // Only require signing when publishing to sonatype, not local (same as in the root project).
    required = { gradle.taskGraph.allTasks.any { it.name.endsWith('ToSonatypeRepository') } }

    sign publishing.publications
}

// All the publications share the same javadoc jar and so each publish task uses the outputs of all
// the sign tasks. Gradle requires this to be declared explicitly.
tasks.withType(AbstractPublishToMaven).configureEach {
    dependsOn(tasks.withType(Sign))
}

dokka {
    dokkaSourceSets.configureEach {
        includes.from("Module.md")
    }
}
