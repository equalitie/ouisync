[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ouisync.service"
dynamic = ["version"]
description = "Python bindings for embedding the Ouisync service in-process"
requires-python = ">=3.11"
dependencies = ["ouisync.session"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]
docs = ["pdoc>=15.0"]

[tool.hatch.version]
# Keep the version in sync with the top-level Cargo.toml
path = "../../../Cargo.toml"
pattern = "^version = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/ouisync"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
