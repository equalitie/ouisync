buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath("com.android.tools.build:gradle:9.3.0")
    }
}

plugins {
    id 'com.android.library'
    id 'org.equalitie.ouisync.convention'
}

group = "org.equalitie.logtee"
version = "1.0"

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    namespace = "org.equalitie.logtee"

    compileSdk = 37

    defaultConfig {
        minSdk = 21

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }
}

kotlin {
    jvmToolchain(17)
}

// Build and package the rust library
def rustCrateDir = file("$projectDir/../../rust")
def rustOutputDir = file("$buildDir/rustJniLibs")

// Flutter passes -Ptarget-platform for the device(s) being targeted.
def flutterPlatformToAbi = [
    'android-arm'  : 'armeabi-v7a',
    'android-arm64': 'arm64-v8a',
    'android-x64'  : 'x86_64',
]
def allAbis = flutterPlatformToAbi.values().toList()
def requestedAbis = project.hasProperty('target-platform')
    ? project.property('target-platform').split(',')
             .collect { flutterPlatformToAbi[it.trim()] }
             .findAll { it != null }
    : allAbis

// For each build type define a task to build the rust library using the corresponding cargo profile
// and hook it into the build.
android.buildTypes.all { buildType ->
    def name = buildType.name
    def outputDir = file("$rustOutputDir/$name")
    def taskName = "cargoBuild${name.capitalize()}"

    android.sourceSets.maybeCreate(name).jniLibs.srcDir(outputDir)

    tasks.register(taskName, Exec) {
        group = 'rust'
        description = "Builds the rust crate for $name"

        doNotTrackState('state is tracked by cargo')

        workingDir = rustCrateDir
        executable = "cargo"
        args = ["ndk", "--output-dir", outputDir.absolutePath]

        requestedAbis.each { abi ->
            args += ["--target", abi]
        }

        if (android.defaultConfig.minSdk != null) {
            args += ['--platform', android.defaultConfig.minSdk as String]
        }

        args += "build"

        if (name != 'debug') {
            args += '--release'
        }

        environment 'ANDROID_NDK_HOME', android.ndkDirectory.absolutePath

        doFirst { outputDir.mkdirs() }
    }

    tasks.whenTaskAdded { task ->
        if (task.name == "merge${name.capitalize()}JniLibFolders") {
            task.dependsOn "cargoBuild${name.capitalize()}"
        }
    }
}

tasks.named('clean') { delete rustOutputDir }
